<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="header-logo">
      <span>S</span> Salon CRM
    </a>
    <nav class="header-nav" id="header-nav"></nav>
  </header>

  <main class="main">
    <div class="form-card">
      <h2>Xush kelibsiz!</h2>
      <p class="subtitle">Tizimga kirish uchun ma'lumotlarni kiriting</p>

      <div class="form-error" id="login-error" style="display:none;"></div>

      <form id="login-form" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="email@misol.com" required>
        </div>
        <div class="form-group">
          <label>Parol</label>
          <input type="password" id="password" placeholder="Parolni kiriting" required>
        </div>
        <button type="submit" class="btn-primary btn-block" id="login-btn" style="padding:14px;font-size:16px;border-radius:var(--radius-sm);margin-top:8px;">
          Kirish
        </button>
      </form>

      <p class="form-link">Akkauntingiz yo'qmi? <a href="register.html">Ro'yxatdan o'ting</a></p>
    </div>
  </main>

  <footer class="footer">Salon CRM &copy; 2026</footer>

  <script src="app.js"></script>
  <script>
    renderHeader("");

    if (isLoggedIn()) {
      window.location.href = isOwner() ? "index.html" : "account.html";
    }

    async function handleLogin(e) {
      e.preventDefault();
      const errEl = document.getElementById("login-error");
      const btn = document.getElementById("login-btn");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      errEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Kirilmoqda...";

      try {
        const data = await apiPost("/api/auth/login/", { email, password });
        setToken(data.token);
        setUser(data.foydalanuvchi);
        toast("Muvaffaqiyatli kirildi!", "success");
        setTimeout(() => {
          window.location.href = data.foydalanuvchi.role === "OWNER" ? "index.html" : "index.html";
        }, 300);
      } catch (e) {
        errEl.textContent = e.xato || "Xatolik yuz berdi";
        errEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Kirish";
      }
    }
  </script>
</body>
</html>

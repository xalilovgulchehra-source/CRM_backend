<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zakaz berish</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="header-logo">
      <span>S</span> Salon CRM
    </a>
    <nav class="header-nav" id="header-nav"></nav>
  </header>

  <main class="main">
    <a href="javascript:history.back()" style="display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-weight:600;margin-bottom:20px;font-size:14px;">&#8592; Orqaga</a>

    <div id="booking-page">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </main>

  <footer class="footer">Salon CRM &copy; 2026</footer>

  <script src="app.js"></script>
  <script>
    renderHeader("salons");

    const params = new URLSearchParams(window.location.search);
    const salonId = params.get("salon");
    const serviceId = params.get("service");
    const serviceName = params.get("name");
    const servicePrice = params.get("price");
    const serviceDuration = params.get("duration");

    if (!salonId || !serviceId) {
      window.location.href = "index.html";
    }

    if (!isLoggedIn()) {
      toast("Zakaz berish uchun tizimga kiring", "error");
      setTimeout(() => window.location.href = "login.html", 500);
    }

    if (!isCustomer()) {
      toast("Faqat mijozlar zakaz bera oladi", "error");
    }

    const container = document.getElementById("booking-page");
    container.innerHTML = `
      <div class="form-card" style="max-width:560px;">
        <h2>Zakaz berish</h2>
        <p class="subtitle">Xizmat ma'lumotlarini tekshirib, sana tanlang</p>

        <div class="booking-summary">
          <div class="summary-row">
            <span class="summary-label">Xizmat</span>
            <span class="summary-value" style="font-weight:700;color:var(--primary);">${serviceName || ""}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Davomiyligi</span>
            <span class="summary-value">${serviceDuration || "?"} daqiqa</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">Narxi</span>
            <span class="summary-value" style="font-weight:700;color:var(--success);">${formatPrice(servicePrice)}</span>
          </div>
        </div>

        <div class="form-error" id="booking-error" style="display:none;"></div>

        <form id="booking-form" onsubmit="return submitBooking(event)">
          <div class="form-group">
            <label>Sanani tanlang</label>
            <input type="date" id="booking-date" required>
          </div>
          <div class="form-group">
            <label>Vaqt</label>
            <input type="time" id="booking-time" required>
          </div>
          <div class="form-group">
            <label>Izoh (ixtiyoriy)</label>
            <textarea id="booking-notes" placeholder="Qo'shimcha izoh yoki istaklaringiz..."></textarea>
          </div>
          <button type="submit" class="btn-primary btn-block" id="booking-submit" style="padding:14px;font-size:16px;border-radius:var(--radius-sm);margin-top:8px;">
            Zakazni tasdiqlash
          </button>
        </form>
      </div>`;

    const today = new Date().toISOString().split("T")[0];
    document.getElementById("booking-date").min = today;
    document.getElementById("booking-date").value = today;

    const now = new Date();
    document.getElementById("booking-time").value =
      String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");

    async function submitBooking(e) {
      e.preventDefault();
      const dateVal = document.getElementById("booking-date").value;
      const timeVal = document.getElementById("booking-time").value;
      const notes = document.getElementById("booking-notes").value;
      const errEl = document.getElementById("booking-error");
      const btn = document.getElementById("booking-submit");

      if (!dateVal || !timeVal) {
        errEl.textContent = "Sana va vaqtni kiriting";
        errEl.style.display = "block";
        return;
      }

      const dateTime = new Date(`${dateVal}T${timeVal}:00`);

      btn.disabled = true;
      btn.textContent = "Yuborilmoqda...";

      try {
        await apiPost(`/api/salons/${salonId}/bookings/`, {
          serviceId: Number(serviceId),
          date: dateTime.toISOString(),
          notes,
        });
        toast("Zakaz muvaffaqiyatli yuborildi!", "success");
        setTimeout(() => (window.location.href = "account.html"), 1000);
      } catch (e) {
        const msg = e.tafsirotlar ? e.tafsirotlar.join(", ") : (e.xato || "Xatolik yuz berdi");
        errEl.textContent = msg;
        errEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Zakazni tasdiqlash";
      }
    }
  </script>
</body>
</html>

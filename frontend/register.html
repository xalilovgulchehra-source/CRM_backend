<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ro'yxatdan o'tish</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="header-logo">
      <span>S</span> Salon CRM
    </a>
    <nav class="header-nav" id="header-nav"></nav>
  </header>

  <main class="main">
    <div class="form-card" style="max-width:500px;">
      <h2>Ro'yxatdan o'tish</h2>
      <p class="subtitle">Yangi akkaunt yarating</p>

      <div class="role-selector">
        <div class="role-option active" data-role="CUSTOMER" onclick="selectRole('CUSTOMER')">
          <div class="role-icon">&#128100;</div>
          <div class="role-label">Mijoz</div>
          <div class="role-desc">Salonlarni ko'rish va zakaz berish</div>
        </div>
        <div class="role-option" data-role="OWNER" onclick="selectRole('OWNER')">
          <div class="role-icon">&#127981;</div>
          <div class="role-label">Salon egasi</div>
          <div class="role-desc">Salonni boshqarish</div>
        </div>
      </div>

      <div class="form-error" id="register-error" style="display:none;"></div>

      <form id="register-form" onsubmit="return handleRegister(event)">
        <input type="hidden" id="role" value="CUSTOMER">

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="email@misol.com" required>
        </div>

        <div class="form-group">
          <label>Telefon raqam</label>
          <input type="tel" id="phone" placeholder="+998 XX XXX XX XX" required>
        </div>

        <div class="form-group">
          <label>Parol</label>
          <input type="password" id="password" placeholder="Kamida 6 ta belgi" required minlength="6">
        </div>

        <div id="customer-fields">
          <div class="form-group">
            <label>To'liq ism</label>
            <input type="text" id="full_name" placeholder="Ismingiz">
          </div>
        </div>

        <div id="owner-fields" style="display:none;">
          <div class="form-group">
            <label>Salon nomi</label>
            <input type="text" id="salon_name" placeholder="Salon nomi">
          </div>
          <div class="form-group">
            <label>Egasi ismi</label>
            <input type="text" id="owner_name" placeholder="Sartaroshxonasi egasi">
          </div>
        </div>

        <button type="submit" class="btn-primary btn-block" id="register-btn" style="padding:14px;font-size:16px;border-radius:var(--radius-sm);margin-top:8px;">
          Ro'yxatdan o'tish
        </button>
      </form>

      <p class="form-link">Akkauntingiz bormi? <a href="login.html">Kirish</a></p>
    </div>
  </main>

  <footer class="footer">Salon CRM &copy; 2026</footer>

  <script src="app.js"></script>
  <script>
    renderHeader("");

    if (isLoggedIn()) window.location.href = "index.html";

    function selectRole(role) {
      document.getElementById("role").value = role;
      document.querySelectorAll(".role-option").forEach(el => {
        el.classList.toggle("active", el.dataset.role === role);
      });
      document.getElementById("customer-fields").style.display = role === "CUSTOMER" ? "block" : "none";
      document.getElementById("owner-fields").style.display = role === "OWNER" ? "block" : "none";
    }

    async function handleRegister(e) {
      e.preventDefault();
      const errEl = document.getElementById("register-error");
      const btn = document.getElementById("register-btn");
      const role = document.getElementById("role").value;

      const body = {
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        password: document.getElementById("password").value,
        role,
      };

      if (role === "CUSTOMER") {
        body.fullName = document.getElementById("full_name").value.trim();
      } else {
        body.salonName = document.getElementById("salon_name").value.trim();
        body.ownerName = document.getElementById("owner_name").value.trim();
      }

      errEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Ro'yxatdan o'tilmoqda...";

      try {
        const data = await apiPost("/api/auth/register/", body);
        setToken(data.token);
        setUser(data.foydalanuvchi);
        toast("Muvaffaqiyatli ro'yxatdan o'tdingiz!", "success");
        setTimeout(() => (window.location.href = "index.html"), 300);
      } catch (e) {
        const msg = e.tafsirotlar ? e.tafsirotlar.join(", ") : (e.xato || "Xatolik yuz berdi");
        errEl.textContent = msg;
        errEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Ro'yxatdan o'tish";
      }
    }
  </script>
</body>
</html>
